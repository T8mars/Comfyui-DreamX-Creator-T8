name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check whether this version is already published
        id: registry-version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          versions="$(curl --silent --show-error --fail \
            "https://api.comfy.org/nodes/dreamx-creator-t8/versions")"
          if jq -e --arg version "${current_version}" \
            'any(.[]; .version == $version)' <<<"${versions}" >/dev/null; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi
      - name: Publish Custom Node
        if: steps.registry-version.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Update Registry metadata and old-version status
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.comfy.org"
          publisher="t8star"
          node="dreamx-creator-t8"
          auth="Authorization: Bearer ${REGISTRY_ACCESS_TOKEN}"

          get_version_id() {
            local version="$1"
            local version_id=""
            for _ in {1..12}; do
              version_id="$(curl --silent --show-error --fail \
                "${api}/nodes/${node}/versions" | \
                jq -r --arg version "${version}" \
                  '.[] | select(.version == $version) | .id' | head -n 1)" || true
              if [[ -n "${version_id}" ]]; then
                printf '%s' "${version_id}"
                return 0
              fi
              sleep 5
            done
            echo "Registry version ${version} was not readable after publication" >&2
            return 1
          }

          node_payload="$(curl --silent --show-error --fail \
            "${api}/nodes/${node}" | jq -c \
            '{id, name, category, description, author, license, icon, repository,
              tags: ["video", "audio", "image-to-video", "upscaling"],
              supported_os, supported_accelerators, supported_comfyui_version,
              supported_comfyui_frontend_version, preempted_comfy_node_names,
              banner_url} | with_entries(select(.value != null))')"
          curl --fail-with-body --retry 3 --request PUT \
            --url "${api}/publishers/${publisher}/nodes/${node}" \
            --header "${auth}" \
            --header "Content-Type: application/json" \
            --data "${node_payload}"

          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          current_id="$(get_version_id "${current_version}")"
          curl --fail-with-body --retry 3 --request PUT \
            --url "${api}/publishers/${publisher}/nodes/${node}/versions/${current_id}" \
            --header "${auth}" \
            --header "Content-Type: application/json" \
            --data '{"changelog":"Ships the verified, frontend-importable direct 512 workflow: 256 spatial tokens for square 512x512, 2 seconds at 24 FPS, normal/Euler at 20 steps, a fixed verified seed, and stability-focused prompts. Retains the official FlowMatch schedule, 4N+1 frame rule, and float32 Audio VAE parity fixes.","deprecated":false}'

          for old_version in 1.0.0 1.0.1 2.0.0 2.0.1; do
            old_id="$(get_version_id "${old_version}")"
            curl --fail-with-body --retry 3 --request PUT \
              --url "${api}/publishers/${publisher}/nodes/${node}/versions/${old_id}" \
              --header "${auth}" \
              --header "Content-Type: application/json" \
              --data '{"changelog":"Superseded by 2.0.2. Upgrade for the verified direct 512 UI workflow and native-pipeline parity fixes.","deprecated":true}'
          done
