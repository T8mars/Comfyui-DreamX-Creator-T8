[project]
name = "dreamx-creator-t8"
version = "2.0.0"
description = "Native ComfyUI V3 nodes for DreamX-Creator joint audio-video generation and causal 2x refinement."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "diffusers>=0.37.1,<0.38",
    "transformers>=4.57,<5",
    "accelerate>=1.10",
    "safetensors>=0.6",
    "einops>=0.8",
    "omegaconf>=2.3",
    "sentencepiece>=0.2",
    "ftfy>=6.3",
    "tqdm>=4.67",
    "numpy>=1.26",
    "Pillow>=10",
    "peft>=0.17,<1",
    "regex>=2024.11",
    "typing_extensions>=4.12",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/T8mars/Comfyui-DreamX-Creator-T8"
Documentation = "https://github.com/T8mars/Comfyui-DreamX-Creator-T8/blob/main/COMFYUI.md"
"Bug Tracker" = "https://github.com/T8mars/Comfyui-DreamX-Creator-T8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "DreamX Creator T8"
Icon = "https://raw.githubusercontent.com/T8mars/Comfyui-DreamX-Creator-T8/main/assets/dreamx-icon.svg"
Banner = "https://raw.githubusercontent.com/T8mars/Comfyui-DreamX-Creator-T8/main/assets/dreamx-banner.svg"
requires-comfyui = ">=0.34.0"
